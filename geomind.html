<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DualMind — GreenRock AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#060e1a; --surface:#0c1829; --surface2:#111f35;
  --border:rgba(255,255,255,0.08); --green:#10b981; --cyan:#06b6d4;
  --gold:#f59e0b; --red:#ef4444; --purple:#7c3aed;
  --text:#e2e8f0; --muted:rgba(255,255,255,0.45);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;}

/* NAV */
.nav{background:rgba(6,14,26,0.97);border-bottom:1px solid var(--border);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-logo-icon{width:30px;height:30px;background:linear-gradient(135deg,#10b981,#06b6d4);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.nav-logo-text{font-size:15px;font-weight:800;color:#fff;}
.nav-logo-text span{color:var(--green);}
.nav-right{display:flex;align-items:center;gap:8px;}
.nav-btn{padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.nav-btn:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-btn.primary{background:linear-gradient(135deg,var(--green),var(--cyan));border:none;color:#fff;}
.lang-select{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:11px;padding:5px 8px;outline:none;cursor:pointer;}

/* ACCESS GATE */
#access-gate{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
.access-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;max-width:400px;width:100%;text-align:center;}
.access-icon{font-size:44px;margin-bottom:14px;}
.access-title{font-size:24px;font-weight:900;color:#fff;margin-bottom:4px;letter-spacing:-0.5px;}
.access-sub{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.6;}
.access-input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:16px;font-weight:700;letter-spacing:3px;text-align:center;outline:none;margin-bottom:10px;transition:border-color 0.2s;}
.access-input:focus{border-color:var(--green);}
.access-submit{width:100%;padding:12px;background:linear-gradient(135deg,var(--green),var(--cyan));border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:opacity 0.2s;}
.access-submit:hover{opacity:0.9;}
.access-error{font-size:11px;color:var(--red);margin-top:6px;display:none;}
.access-demo{margin-top:14px;font-size:11px;color:var(--muted);}
.access-demo a{color:var(--cyan);cursor:pointer;}

/* MODE SELECTOR */
#mode-selector{flex:1;display:none;align-items:center;justify-content:center;padding:20px;}
.mode-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;max-width:520px;width:100%;text-align:center;}
.mode-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px;}
.mode-sub{font-size:12px;color:var(--muted);margin-bottom:24px;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mode-btn{padding:20px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:all 0.2s;text-align:center;}
.mode-btn:hover{border-color:var(--green);background:rgba(16,185,129,0.08);}
.mode-btn.geo{border-color:rgba(16,185,129,0.3);}
.mode-btn.sci{border-color:rgba(6,182,212,0.3);}
.mode-btn-icon{font-size:32px;margin-bottom:8px;}
.mode-btn-title{font-size:14px;font-weight:800;color:#fff;margin-bottom:4px;}
.mode-btn-desc{font-size:11px;color:var(--muted);line-height:1.5;}
.mode-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-top:6px;}
.mode-tag.geo{background:rgba(16,185,129,0.15);color:var(--green);}
.mode-tag.sci{background:rgba(6,182,212,0.15);color:var(--cyan);}

/* MAIN APP */
#app{flex:1;display:none;flex-direction:column;max-width:960px;width:100%;margin:0 auto;padding:12px;}

/* MODE BAR */
.mode-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.mode-pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;transition:all 0.2s;}
.mode-pill.active.geo{background:rgba(16,185,129,0.15);border-color:var(--green);color:var(--green);}
.mode-pill.active.sci{background:rgba(6,182,212,0.15);border-color:var(--cyan);color:var(--cyan);}
.mode-switch-btn{margin-left:auto;padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;}
.mode-switch-btn:hover{color:#fff;border-color:rgba(255,255,255,0.2);}

/* FILE UPLOAD AREA (Geology mode) */
.upload-section{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.upload-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.file-slot{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;transition:all 0.2s;cursor:pointer;position:relative;}
.file-slot:hover{border-color:rgba(16,185,129,0.3);}
.file-slot.optional{border-style:dashed;}
.file-slot.uploaded{border-color:var(--green);background:rgba(16,185,129,0.06);}
.file-slot-num{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.file-slot-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px;}
.file-slot-desc{font-size:10px;color:var(--muted);margin-bottom:6px;line-height:1.4;}
.file-slot-status{font-size:10px;color:var(--muted);}
.file-slot-status.ok{color:var(--green);}
.file-slot-status.opt{color:var(--gold);}
.file-slot-btn{font-size:10px;padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--cyan);cursor:pointer;margin-top:4px;}
.file-slot-btn:hover{background:rgba(6,182,212,0.1);}

/* PDF PAGE SELECTOR */
.pdf-pages{display:none;margin-top:6px;padding:6px 8px;background:rgba(0,0,0,0.2);border-radius:6px;font-size:10px;color:var(--muted);}
.pdf-pages input{width:48%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:4px;color:#fff;padding:3px 6px;font-size:10px;text-align:center;}
.pdf-pages label{font-size:9px;color:var(--muted);display:block;margin-bottom:2px;}

/* PDF Page Selector Panel */
.pdf-selector-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0;display:none;}
.pdf-selector-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.pdf-thumbs-wrap{overflow-x:auto;padding-bottom:6px;}
.pdf-thumbs{display:flex;gap:8px;padding:4px 0;}
.pdf-thumb{flex-shrink:0;cursor:pointer;border:2px solid var(--border);border-radius:6px;overflow:hidden;position:relative;transition:all 0.2s;background:rgba(255,255,255,0.04);}
.pdf-thumb:hover{border-color:var(--cyan);}
.pdf-thumb.selected{border-color:var(--cyan);background:rgba(6,182,212,0.1);}
.pdf-thumb canvas{display:block;width:72px;height:96px;object-fit:cover;}
.pdf-thumb-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.7);font-size:9px;font-weight:700;color:#fff;text-align:center;padding:2px 0;}
.pdf-thumb-check{position:absolute;top:3px;right:3px;width:16px;height:16px;background:var(--cyan);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:9px;color:#fff;}
.pdf-thumb.selected .pdf-thumb-check{display:flex;}
.pdf-page-inputs{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.pdf-page-inputs label{font-size:11px;color:var(--muted);}
.pdf-page-inputs input{width:70px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:6px;color:#fff;padding:5px 8px;font-size:12px;text-align:center;outline:none;}
.pdf-confirm-btn{margin-top:8px;padding:7px 18px;background:linear-gradient(135deg,var(--green),var(--cyan));border:none;border-radius:8px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;width:100%;}
.pdf-status{font-size:11px;color:var(--green);margin-top:6px;display:none;}

/* MULTIPLE FILE LIST */
.file-list{margin-top:6px;max-height:80px;overflow-y:auto;}
.file-list-item{font-size:10px;color:var(--green);padding:2px 0;display:flex;align-items:center;gap:4px;}
.file-list-item button{background:none;border:none;color:var(--red);cursor:pointer;font-size:10px;padding:0 2px;}

/* CHAT */
.chat-wrap{flex:1;display:flex;flex-direction:column;gap:10px;}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:200px;max-height:55vh;padding-right:4px;}
.msg{display:flex;flex-direction:column;gap:6px;}
.msg-user{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);border-radius:12px 12px 4px 12px;padding:10px 14px;font-size:13px;align-self:flex-end;max-width:85%;}
.msg-system{font-size:11px;color:var(--muted);text-align:center;padding:4px;}

/* LLM PANELS */
.llm-panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.llm-panel{background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.llm-panel-header{padding:7px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;display:flex;align-items:center;gap:6px;}
.llm-panel-header.gpt{background:rgba(16,185,129,0.12);color:var(--green);}
.llm-panel-header.claude{background:rgba(124,58,237,0.12);color:#a78bfa;}
.llm-panel-header.merged{background:rgba(6,182,212,0.12);color:var(--cyan);}
.llm-panel-body{padding:10px 12px;font-size:12px;line-height:1.7;color:var(--text);max-height:420px;overflow-y:auto;}
.llm-panel-body h1,.llm-panel-body h2,.llm-panel-body h3{font-size:13px;font-weight:700;margin:8px 0 4px;color:#fff;}
.llm-panel-body p{margin-bottom:6px;}
.llm-panel-body ul,.llm-panel-body ol{padding-left:16px;margin-bottom:6px;}
.llm-panel-body li{margin-bottom:3px;}
.llm-panel-body strong{color:#fff;}
.merged-panel{grid-column:1/-1;}
@media(max-width:700px){.llm-panels{grid-template-columns:1fr;}}

/* CONFIDENCE SCORECARD */
.scorecard{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:8px;}
.scorecard-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:10px;}
.scorecard-hero{text-align:center;padding:10px 0 12px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.scorecard-pct{font-size:44px;font-weight:900;line-height:1;}
.scorecard-label{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px;}
.scorecard-verdict{display:inline-block;margin-top:8px;padding:4px 16px;border-radius:20px;font-size:13px;font-weight:800;letter-spacing:0.3px;}
.scorecard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.score-item{text-align:center;background:rgba(255,255,255,0.03);border-radius:8px;padding:8px 4px;}
.score-val{font-size:17px;font-weight:900;}
.score-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-top:2px;}
.score-bar{height:3px;border-radius:2px;background:rgba(255,255,255,0.06);margin-bottom:5px;overflow:hidden;}
.score-bar-fill{height:100%;border-radius:2px;}
.divergence-alert{background:rgba(239,68,68,0.1);border:1px solid var(--red);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:11px;color:var(--red);font-weight:700;}

/* GENERAL SCIENCE CONFIDENCE */
.sci-confidence{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:8px;}
.sci-conf-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:10px;}
.sci-conf-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.sci-conf-item{background:rgba(255,255,255,0.03);border-radius:8px;padding:10px;}
.sci-conf-item-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:4px;}
.sci-conf-item-bar{height:6px;border-radius:3px;background:rgba(255,255,255,0.06);overflow:hidden;margin-bottom:4px;}
.sci-conf-item-fill{height:100%;border-radius:3px;transition:width 0.5s;}
.sci-conf-item-pct{font-size:16px;font-weight:900;}
.sci-conf-overall{grid-column:1/-1;text-align:center;padding:12px;background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.2);border-radius:8px;}
.sci-conf-overall-pct{font-size:40px;font-weight:900;color:var(--cyan);}

/* TYPING */
.typing{display:flex;gap:4px;align-items:center;padding:8px 0;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--green);animation:bounce 1.2s infinite;}
.typing span:nth-child(2){animation-delay:0.2s;}
.typing span:nth-child(3){animation-delay:0.4s;}
.typing-label{font-size:11px;color:var(--muted);margin-left:4px;}
@keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:0.4;}40%{transform:scale(1);opacity:1;}}

/* INPUT BAR */
.input-bar{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-top:10px;}
.input-top{display:flex;gap:8px;align-items:flex-end;}
.input-textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px;resize:none;min-height:40px;max-height:120px;font-family:inherit;line-height:1.5;}
.input-send{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--green),var(--cyan));border:none;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:opacity 0.2s;}
.input-send:hover{opacity:0.85;}
.input-bottom{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.input-attach{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:11px;padding:4px 10px;cursor:pointer;transition:all 0.2s;}
.input-attach:hover{border-color:var(--cyan);color:var(--cyan);}
.input-files-preview{display:flex;gap:6px;flex-wrap:wrap;}
.input-file-chip{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);border-radius:6px;padding:3px 8px;font-size:10px;color:var(--green);display:flex;align-items:center;gap:4px;}
.input-file-chip button{background:none;border:none;color:var(--red);cursor:pointer;font-size:10px;padding:0;}
.export-bar{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.export-btn{padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:11px;cursor:pointer;transition:all 0.2s;}
.export-btn:hover{border-color:var(--cyan);color:var(--cyan);}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:12px;color:#fff;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">⛏</div>
    <div class="nav-logo-text">Green<span>Rock</span> AI</div>
  </a>
  <div class="nav-right">
    <select class="lang-select" id="lang-select" style="background:#ffffff;color:#1a1a2e;font-weight:600;border:1px solid rgba(0,180,216,0.4);padding:5px 10px;">
      <option value="English" style="background:#fff;color:#1a1a2e;">🌐 English</option>
      <option value="French" style="background:#fff;color:#1a1a2e;">🇫🇷 Français</option>
      <option value="Chinese" style="background:#fff;color:#1a1a2e;">🇨🇳 中文 Chinese</option>
      <option value="Portuguese" style="background:#fff;color:#1a1a2e;">🇵🇹 Português</option>
      <option value="Arabic" style="background:#fff;color:#1a1a2e;">🇸🇦 العربية Arabic</option>
      <option value="Spanish" style="background:#fff;color:#1a1a2e;">🇪🇸 Español</option>
    </select>
    <button class="nav-btn" onclick="location.href='index.html'">Home</button>
  </div>
</nav>

<!-- ACCESS GATE -->
<div id="access-gate">
  <div class="access-card">
    <div class="access-icon">⚡</div>
    <div class="access-title">DualMind</div>
    <div class="access-sub">Two AI models. One verified answer.<br>GeoMind DualMind · General Science DualMind</div>
    <input class="access-input" id="code-input" type="text" placeholder="ACCESS CODE" maxlength="20" autocomplete="off">
    <button class="access-submit" id="code-submit">Activate DualMind</button>
    <div class="access-error" id="code-error">Invalid or expired code</div>
    <div style="margin-top:14px;padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;display:none;" id="code-display-card">
      <div style="font-size:18px;font-weight:900;letter-spacing:3px;color:#fff;margin-bottom:4px;" id="code-display-text"></div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:8px;" id="code-display-meta"></div>
      <button id="code-copy-btn" style="width:100%;padding:8px;background:linear-gradient(135deg,var(--green),var(--cyan));border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
        &#128203; Copy Code
      </button>
    </div>
    <div style="color:rgba(255,255,255,0.2);font-size:11px;margin-top:14px;">Access codes are issued by GreenRock AI</div>
  </div>
</div>

<!-- MODE SELECTOR (hidden — replaced by tabs in app) -->
<div id="mode-selector" style="display:none!important;"></div>

<!-- MAIN APP -->
<div id="app">

  <!-- MODE TABS -->
  <div class="mode-bar">
    <div class="mode-pill active geo" id="pill-geo" onclick="selectMode('geo')" style="cursor:pointer;">&#9874; GeoMind DualMind</div>
    <div class="mode-pill sci" id="pill-sci" onclick="selectMode('sci')" style="cursor:pointer;">&#128300; General Science</div>
  </div>

  <!-- GEOLOGY: FILE UPLOAD SECTION -->
  <div class="upload-section" id="geo-upload" style="display:none;">
    <div class="upload-section-title">Upload Data Files — select all that apply</div>
    <div class="file-grid" id="file-grid"></div>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <select id="geo-mode" style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:11px;padding:5px 10px;outline:none;">
        <option value="Exploration">Exploration Mode</option>
        <option value="Drill Plan">Drill Plan Mode</option>
        <option value="Report">Report Mode</option>
      </select>
      <select id="cutoff-grade" style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:11px;padding:5px 10px;outline:none;">
        <option value="0.5">Cu cut-off: 0.5%</option>
        <option value="0.4">0.4%</option>
        <option value="0.6">0.6%</option>
        <option value="0.8">0.8%</option>
        <option value="1.0">1.0%</option>

// Generate stable device fingerprint
function getDeviceId(){
  var stored = localStorage.getItem('dm_device_id');
  if(stored) return stored;
  // Build fingerprint from available browser properties
  var fp = [
    navigator.userAgent,
    navigator.language,
    screen.width + 'x' + screen.height,
    screen.colorDepth,
    new Date().getTimezoneOffset(),
    navigator.hardwareConcurrency||'',
    navigator.platform||''
  ].join('|');
  // Simple hash
  var hash = 0;
  for(var i=0;i<fp.length;i++){
    hash = ((hash<<5)-hash)+fp.charCodeAt(i);
    hash |= 0;
  }
  var id = 'dev-' + Math.abs(hash).toString(36) + '-' + Date.now().toString(36);
  localStorage.setItem('dm_device_id', id);
  return id;
}

async function sendMessage(){
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if(!text && !_attachedFiles.length && !Object.keys(_geoFiles).length) return;

  // Protect system prompts from disclosure
  var blocked = /system.?prompt|show.?prompt|reveal.?prompt|what.?prompt|your.?instruction|ignore.?previous|ignore.?above|disregard.?instruction|jailbreak|act.?as.?dan|prompt.?inject/i;
  if(blocked.test(text)){
    addSystemMsg('This type of request is not permitted on this platform.');
    return;
  }

  var msgs = document.getElementById('chat-messages');

  // Build user message content
  var userContent = [];
  if(text) userContent.push({type:'text',text:text});

  // Add attached files
  for(var i=0;i<_attachedFiles.length;i++){
    var f = _attachedFiles[i];
    var ext = f.name.split('.').pop().toLowerCase();
    if(['png','jpg','jpeg'].includes(ext)){
      var b64 = await readFileBase64(f);
      userContent.push({type:'image_url',image_url:{url:'data:image/'+ext+';base64,'+b64}});
    } else if(ext === 'pdf'){
      var b64 = await readFileBase64(f);
      var pageNote = '';
      var fromPage = 1, toPage = 9999;
      if(_pdfConfirmed && _selectedPages.from){
        fromPage = _selectedPages.from;
        toPage   = _selectedPages.to;
        pageNote = ' [Pages '+fromPage+'-'+toPage+']';
      }
      // Extract text from PDF using PDF.js for GPT-4o
      var pdfExtractedText = await extractPdfText(f, fromPage, toPage);
      // Send text version (for GPT-4o) AND document version (for Claude)
      userContent.push({
        type: 'pdf_dual',
        filename: f.name,
        pageNote: pageNote,
        text: pdfExtractedText,   // used by GPT-4o
        base64: b64,              // used by Claude
        mediaType: 'application/pdf'
      });
    } else if(['xlsx','xls'].includes(ext)){
      // Parse Excel as readable text using SheetJS
      var xlsText = await readExcelAsText(f);
      userContent.push({type:'text',text:'[Excel: '+f.name+']\n'+xlsText});
    } else {
      // CSV, TXT, JSON etc - read as plain text
      var text2 = await readFileAsText(f);
      userContent.push({type:'text',text:'[File: '+f.name+']\n'+text2.substring(0,8000)});
    }
  }

  // Add geo files if in geo mode
  if(_currentMode==='geo'){
    for(var sid=0;sid<7;sid++){
      if(_geoFiles[sid]&&_geoFiles[sid].files.length){
        var slot = GEO_SLOTS[sid];
        for(var fi=0;fi<_geoFiles[sid].files.length;fi++){
          var gf = _geoFiles[sid].files[fi];
          var gb64 = await readFileBase64(gf);
          var gext = gf.name.split('.').pop().toLowerCase();
          var pageNote = '';
          var pfrom = document.getElementById('pg-from-'+sid);
          var pto = document.getElementById('pg-to-'+sid);
          if(pfrom&&pfrom.value&&pto&&pto.value) pageNote=' [Pages '+pfrom.value+'-'+pto.value+']';
          if(['png','jpg','jpeg'].includes(gext)){
            userContent.push({type:'image_url',image_url:{url:'data:image/'+gext+';base64,'+gb64}});
          } else if(gext === 'pdf'){
            var gfFromPage = 1, gfToPage = 9999;
            var pfrom2 = document.getElementById('pg-from-'+sid);
            var pto2   = document.getElementById('pg-to-'+sid);
            if(pfrom2 && pfrom2.value) gfFromPage = parseInt(pfrom2.value)||1;
            if(pto2   && pto2.value)   gfToPage   = parseInt(pto2.value)||9999;
            var geoPdfText = await extractPdfText(gf, gfFromPage, gfToPage);
            userContent.push({
              type: 'pdf_dual',
              filename: slot.num+'. '+slot.name+pageNote+': '+gf.name,
              pageNote: pageNote,
              text: geoPdfText,
              base64: gb64,
              mediaType: 'application/pdf'
            });
          } else if(['xlsx','xls'].includes(gext)){
            var xlsText2 = await readExcelAsText(gf);
            userContent.push({type:'text',text:'['+slot.num+'. '+slot.name+pageNote+': '+gf.name+']\n'+xlsText2});
          } else {
            var textContent = await readFileAsText(gf);
            userContent.push({type:'text',text:'['+slot.num+'. '+slot.name+pageNote+': '+gf.name+']\n'+textContent.substring(0,8000)});
          }
        }
      }
    }
    // Add cutoff and mode
    var geoModeVal = document.getElementById('geo-mode').value;
    var cutoff = document.getElementById('cutoff-grade').value;
    if(userContent.length>0){
      var lastText = userContent[userContent.length-1];
      if(lastText.type==='text') lastText.text += '\n[Mode: '+geoModeVal+' | Cu cut-off: '+cutoff+'%]';
      else userContent.push({type:'text',text:'[Mode: '+geoModeVal+' | Cu cut-off: '+cutoff+'%]'});
    }
  }

  if(userContent.length===0) return;
  var msgPayload = userContent.length===1&&userContent[0].type==='text' ? userContent[0].text : userContent;

  // Show user message
  addUserMessage(text || '[Files uploaded]');
  input.value=''; input.style.height='auto';
  _attachedFiles=[];
  renderFilesPreview();
  hidePdfSelector();

  _messages.push({role:'user',content:msgPayload});

  // Typing indicator
  var typingEl = addTyping();

  try{
    var lang = document.getElementById('lang-select').value;
    var geoMode = _currentMode==='geo' ? document.getElementById('geo-mode').value : null;

    var res = await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        _appSecret:APP_SECRET,
        action:'dualmind',
        mode:_currentMode,
        pipelineMode:geoMode,
        lang:lang,
        messages:_messages,
        code:_activeCode
      })
    });
    var data = await res.json();
    typingEl.remove();

    if(data.error){addSystemMsg('Error: '+data.error);return;}

    if(!data.llm1) data.llm1='_(LLM 1 did not respond)_';
    if(!data.llm1b) data.llm1b='_(LLM 2 independent analysis unavailable)_';
    if(!data.llm2) data.llm2='_(Merged response unavailable)_';

    _messages.push({role:'assistant',content:data.llm2});
    addDualResponse(data);

    // Track cost and check limit
    if(data.usage && _activeCode && _activeCode !== 'JOHNNY11'){
      trackAICost(_activeCode, data.usage, _currentMode);
    }

  }catch(e){
    typingEl.remove();
    addSystemMsg('Connection error: '+e.message);
  }
}

function readFileBase64(file){
  return new Promise(function(resolve){
    var r = new FileReader();
    r.onload=function(){ resolve(r.result.split(',')[1]||''); };
    r.readAsDataURL(file);
  });
}

async function extractPdfText(file, fromPage, toPage){
  try{
    if(typeof pdfjsLib === 'undefined') return '[PDF text extraction not available]';
    fromPage = fromPage || 1;
    toPage   = toPage   || 9999;
    var arrayBuf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({data: arrayBuf}).promise;
    var numPages = pdf.numPages;
    toPage = Math.min(toPage, numPages);
    var text = '';
    for(var p = fromPage; p <= toPage && text.length < 50000; p++){
      var page = await pdf.getPage(p);
      var tc   = await page.getTextContent();
      var pageText = tc.items.map(function(i){ return i.str; }).join(' ');
      text += '--- Page '+p+' ---' + String.fromCharCode(10) + pageText + String.fromCharCode(10);
    }
    return text.trim().substring(0, 50000) || '[No text found in PDF — may be a scanned image]';
  }catch(e){
    return '[PDF text extraction error: '+e.message+']';
  }
}

function readFileAsText(file){
  return new Promise(function(resolve){
    var r = new FileReader();
    r.onload=function(){ resolve(r.result||''); };
    r.onerror=function(){ resolve('[Could not read file]'); };
    r.readAsText(file);
  });
}

async function readExcelAsText(file){
  try{
    if(typeof XLSX === 'undefined') return '[Excel parsing not available - please upload as CSV]';
    var b64 = await readFileBase64(file);
    var wb = XLSX.read(b64, {type:'base64'});
    var result = '';
    wb.SheetNames.forEach(function(sheetName){
      var ws = wb.Sheets[sheetName];
      var csv = XLSX.utils.sheet_to_csv(ws);
      result += '[Sheet: '+sheetName+']\n'+csv+'\n';
    });
    return result.substring(0, 12000);
  }catch(e){
    return '[Excel read error: '+e.message+' — please convert to CSV and re-upload]';
  }
}

function cleanText(t){
  var s = t||'';
  // Remove code blocks
  s = s.replace(/```json[\s\S]*?```/g,'');
  // Remove scorecard JSON
  s = s.replace(/\{[\s\S]{0,500}"scorecard"[\s\S]{0,1000}\}/g,'');
  // Remove confidence JSON (keep text, remove only the JSON block at end)
  s = s.replace(/\{[\s\S]{0,200}"confidence"[\s\S]{0,500}\}/g,'');
  return s.trim();
}

// ── GEO SCORECARD ─────────────────────────────────────────
function buildGeoScorecard(text){
  var scorecard = null;
  try{
    var idx=text.indexOf('{"scorecard"');
    if(idx===-1) idx=text.indexOf('{ "scorecard"');
    if(idx!==-1){
      var depth=0,end=-1;
      for(var i=idx;i<text.length;i++){
        if(text[i]==='{') depth++;
        else if(text[i]==='}'){depth--;if(depth===0){end=i;break;}}
      }
      if(end!==-1) scorecard=JSON.parse(text.substring(idx,end+1)).scorecard;
    }
  }catch(e){}
  if(!scorecard) return '';

  var score=scorecard.combined_score||scorecard.overall_confidence||0;
  var grade=scorecard.grade||'';
  var verdict=scorecard.verdict||'';
  var sc=score>=75?'var(--green)':score>=55?'var(--gold)':'var(--red)';
  var vc=verdict==='Drill Now'?'var(--green)':verdict.includes('Not')||verdict.includes('Reverif')?'var(--red)':'var(--gold)';
  var isDivergence=verdict.toLowerCase().includes('reverif')||score<40;

  var metrics=[
    {k:'data_quality',l:'Data Quality'},
    {k:'geological_consistency',l:'Geo. Consistency'},
    {k:'anomaly_strength',l:'Anomaly'},
    {k:'target_definition',l:'Target Def.'},
    {k:'risk_assessment',l:'Risk'},
    {k:'recommendation_clarity',l:'Clarity'}
  ];

  var html='<div class="scorecard">';
  html+='<div class="scorecard-title">GeoMind Confidence Scorecard</div>';
  if(isDivergence) html+='<div class="divergence-alert">&#9888; DIVERGENCE DETECTED — Manual review required before drilling</div>';
  html+='<div class="scorecard-hero">';
  html+='<div class="scorecard-pct" style="color:'+sc+'">'+score+'<span style="font-size:20px;color:var(--muted)">%</span></div>';
  html+='<div class="scorecard-label">Overall Confidence</div>';
  html+='<div class="scorecard-verdict" style="color:'+vc+';background:rgba(255,255,255,0.05);">'+verdict+'</div>';
  html+='<div style="font-size:11px;color:var(--muted);margin-top:4px;">Grade: <strong style="color:#fff">'+grade+'</strong></div>';
  html+='</div><div class="scorecard-grid">';
  metrics.forEach(function(m){
    var v=scorecard[m.k]||0;
    var c=v>=75?'var(--green)':v>=55?'var(--gold)':'var(--red)';
    html+='<div class="score-item"><div class="score-bar"><div class="score-bar-fill" style="width:'+v+'%;background:'+c+'"></div></div>'+
      '<div class="score-val" style="color:'+c+'">'+v+'</div>'+
      '<div class="score-label">'+m.l+'</div></div>';
  });
  html+='</div></div>';
  return html;
}

// ── SCIENCE CONFIDENCE ────────────────────────────────────
function buildSciConfidence(text){
  var conf=null;
  // Try multiple extraction strategies
  try{
    // Strategy 1: find {"confidence": or { "confidence":
    var searches = ['{"confidence"', '{ "confidence"', '{\n  "confidence"', '{\n"confidence"'];
    var idx = -1;
    for(var s=0;s<searches.length;s++){
      idx = text.indexOf(searches[s]);
      if(idx!==-1) break;
    }
    if(idx!==-1){
      var depth=0,end=-1;
      for(var i=idx;i<text.length;i++){
        if(text[i]==='{') depth++;
        else if(text[i]==='}'){depth--;if(depth===0){end=i;break;}}
      }
      if(end!==-1){
        var jsonStr = text.substring(idx,end+1);
        var parsed = JSON.parse(jsonStr);
        conf = parsed.confidence || parsed;
        // Validate it has expected fields
        if(!conf.overall && !conf.factual_accuracy) conf=null;
      }
    }
    // Strategy 2: regex fallback
    if(!conf){
      var match = text.match(/"overall"\s*:\s*(\d+)/);
      if(match){
        conf = {
          overall: parseInt(match[1]),
          factual_accuracy: parseInt((text.match(/"factual_accuracy"\s*:\s*(\d+)/)||[0,70])[1]),
          source_reliability: parseInt((text.match(/"source_reliability"\s*:\s*(\d+)/)||[0,70])[1]),
          reasoning_quality: parseInt((text.match(/"reasoning_quality"\s*:\s*(\d+)/)||[0,70])[1]),
          consensus_level: parseInt((text.match(/"consensus_level"\s*:\s*(\d+)/)||[0,65])[1]),
          completeness: parseInt((text.match(/"completeness"\s*:\s*(\d+)/)||[0,70])[1]),
          uncertainty_acknowledged: parseInt((text.match(/"uncertainty_acknowledged"\s*:\s*(\d+)/)||[0,70])[1]),
          verdict: (text.match(/"verdict"\s*:\s*"([^"]+)"/)||['','Moderate Confidence'])[1]
        };
      }
    }
  }catch(e){ conf=null; }
  if(!conf) return '';

  var overall=conf.overall||0;
  var oc=overall>=75?'var(--cyan)':overall>=55?'var(--gold)':'var(--red)';

  var dims=[
    {k:'factual_accuracy',l:'Factual Accuracy'},
    {k:'source_reliability',l:'Source Reliability'},
    {k:'reasoning_quality',l:'Reasoning Quality'},
    {k:'consensus_level',l:'Scientific Consensus'},
    {k:'completeness',l:'Answer Completeness'},
    {k:'uncertainty_acknowledged',l:'Uncertainty Noted'}
  ];

  var html='<div class="sci-confidence">';
  html+='<div class="sci-conf-title">Science DualMind — Confidence Ratings</div>';
  html+='<div class="sci-conf-grid">';

  dims.forEach(function(d){
    var v=conf[d.k]||0;
    var c=v>=75?'var(--cyan)':v>=55?'var(--gold)':'var(--red)';
    html+='<div class="sci-conf-item">'+
      '<div class="sci-conf-item-label">'+d.l+'</div>'+
      '<div class="sci-conf-item-bar"><div class="sci-conf-item-fill" style="width:'+v+'%;background:'+c+'"></div></div>'+
      '<div class="sci-conf-item-pct" style="color:'+c+'">'+v+'%</div>'+
      '</div>';
  });

  html+='<div class="sci-conf-overall">'+
    '<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Overall Answer Confidence</div>'+
    '<div class="sci-conf-overall-pct" style="color:'+oc+'">'+overall+'%</div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:4px;">'+(conf.verdict||'')+'</div>'+
    '</div>';

  html+='</div></div>';
  return html;
}

async function trackAICost(code, usage, mode){

    local.inputTokens  = (local.inputTokens||0)  + (usage.prompt_tokens||0);
    local.outputTokens = (local.outputTokens||0) + (usage.completion_tokens||0);
    local.calls        = (local.calls||0) + 1;
    localStorage.setItem(key, JSON.stringify(local));
  }catch(e){}

  try{
    var res = await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        _appSecret:APP_SECRET,
        action:'track-cost',

        usage:usage,
        mode:mode

    if(data.limitReached){
      showLimitOverlay(data.cost, data.limit);

var _currentPdfFile = null;

var _pdfConfirmed = false;

// Set PDF.js worker

async function showPdfSelector(file){
  _currentPdfFile = file;
  _pdfConfirmed = false;
  var panel = document.getElementById('pdf-selector-panel');
  var thumbs = document.getElementById('pdf-thumbs');
  var status = document.getElementById('pdf-status');
  panel.style.display = 'block';
  thumbs.innerHTML = '<span style="font-size:11px;color:var(--muted);padding:10px;">Loading pages...</span>';
  status.style.display = 'none';

  try{
    if(typeof pdfjsLib === 'undefined') throw new Error('PDF.js not loaded');
    var arrayBuf = await file.arrayBuffer();
    _pdfDoc = await pdfjsLib.getDocument({data: arrayBuf}).promise;
    var numPages = _pdfDoc.numPages;

    document.getElementById('pdf-from').value = 1;
    document.getElementById('pdf-to').value = Math.min(numPages, 5);
    document.getElementById('pdf-page-count').textContent = numPages + ' pages total';

    // Render thumbnails
    thumbs.innerHTML = '';
    var maxThumbs = Math.min(numPages, 20);
    for(var p = 1; p <= maxThumbs; p++){
      var thumbDiv = document.createElement('div');
      thumbDiv.className = 'pdf-thumb';
      thumbDiv.dataset.page = p;
      var canvas = document.createElement('canvas');
      var label = document.createElement('div');
      label.className = 'pdf-thumb-label';
      label.textContent = 'P' + p;
      var check = document.createElement('div');
      check.className = 'pdf-thumb-check';
      check.innerHTML = '&#10003;';
      thumbDiv.appendChild(canvas);
      thumbDiv.appendChild(label);
      thumbDiv.appendChild(check);
      thumbs.appendChild(thumbDiv);

      // Render page to canvas
      (function(pg, cv, td){
        _pdfDoc.getPage(pg).then(function(page){
          var vp = page.getViewport({scale: 0.3});
          cv.width = vp.width;
          cv.height = vp.height;
          cv.style.width = '72px';
          cv.style.height = '96px';
          page.render({canvasContext: cv.getContext('2d'), viewport: vp});
        });
        td.addEventListener('click', function(){
          td.classList.toggle('selected');
          updatePageRange();
        });
      })(p, canvas, thumbDiv);
    }
    if(numPages > 20){
      var more = document.createElement('span');
      more.style.cssText = 'font-size:10px;color:var(--muted);padding:10px;align-self:center;';
      more.textContent = '+ '+(numPages-20)+' more pages';
      thumbs.appendChild(more);
    }

    // Auto-select first 5 pages and auto-confirm immediately
    updateThumbSelectionFromInputs();
    validateAndConfirmPages(false);

  }catch(e){
    thumbs.innerHTML = '<span style="font-size:11px;color:var(--muted);padding:10px;">Preview unavailable — pages will still be sent by range.</span>';
    document.getElementById('pdf-page-count').textContent = '';
  }
}

function updatePageRange(){
  var selected = document.querySelectorAll('.pdf-thumb.selected');
  if(!selected.length) return;
  var pages = Array.from(selected).map(function(t){ return parseInt(t.dataset.page); }).sort(function(a,b){return a-b;});
  document.getElementById('pdf-from').value = pages[0];
  document.getElementById('pdf-to').value = pages[pages.length-1];
  // Auto-confirm after thumb selection
  validateAndConfirmPages(false);
}

function updateThumbSelectionFromInputs(){
  var from = parseInt(document.getElementById('pdf-from').value)||1;
  var to   = parseInt(document.getElementById('pdf-to').value)||1;
  document.querySelectorAll('.pdf-thumb').forEach(function(t){
    var p = parseInt(t.dataset.page);
    if(p >= from && p <= to) t.classList.add('selected');
    else t.classList.remove('selected');
  });
}

document.addEventListener('DOMContentLoaded', function(){
  var fromInput = document.getElementById('pdf-from');
  var toInput   = document.getElementById('pdf-to');
  if(fromInput) fromInput.addEventListener('input', function(){ validateAndConfirmPages(); updateThumbSelectionFromInputs(); });
  if(toInput)   toInput.addEventListener('input',   function(){ validateAndConfirmPages(); updateThumbSelectionFromInputs(); });

  // Confirm button still available but auto-confirm happens on any change
  var confirmBtn = document.getElementById('pdf-confirm-btn');
  if(confirmBtn) confirmBtn.addEventListener('click', function(){ validateAndConfirmPages(true); });
});

function validateAndConfirmPages(showToast){
  var fromEl = document.getElementById('pdf-from');
  var toEl   = document.getElementById('pdf-to');
  var status = document.getElementById('pdf-status');
  var confirmBtn = document.getElementById('pdf-confirm-btn');
  if(!fromEl || !toEl) return;

  var totalPages = _pdfDoc ? _pdfDoc.numPages : 999;
  var from = Math.max(1, parseInt(fromEl.value) || 1);
  var to   = Math.max(1, parseInt(toEl.value)   || 5);

  // Clamp: from >= 1, to <= totalPages, from <= to
  from = Math.max(1, Math.min(from, totalPages));
  to   = Math.max(from, Math.min(to, totalPages));

  // Auto-correct inputs
  fromEl.value = from;
  toEl.value   = to;

  var count = Math.max(0, to - from + 1);
  _pdfConfirmed = true;
  _selectedPages = {from: from, to: to};

  if(status){
    status.textContent = '\u2713 ' + count + ' page(s) confirmed — ready!';
    status.style.display = 'block';
  }
  if(confirmBtn){
    confirmBtn.textContent = '\u2713 ' + count + ' page(s) confirmed — ready!';
  }
  if(showToast) toast(count + ' pages ready from PDF');
}

function hidePdfSelector(){
  var panel = document.getElementById('pdf-selector-panel');
  if(panel) panel.style.display = 'none';
  _currentPdfFile = null;
  _pdfDoc = null;
  _pdfConfirmed = false;
  _selectedPages = [];
  var btn = document.getElementById('pdf-confirm-btn');
  if(btn) btn.textContent = '\u2713 Confirm Page Selection — Ready!';
  var status = document.getElementById('pdf-status');
  if(status){ status.style.display='none'; status.textContent=''; }
}

function clearAllAttached(){
  _attachedFiles = [];
  renderFilesPreview();
  hidePdfSelector();
  toast('All files cleared');
}


// ── SATELLITE MAP ─────────────────────────────────────────

// Map is now inline — see addInlineMap()

function parseCoordinates(text){
  var coords = [];
  var seen = new Set();
  var label_idx = 1;

  function addCoord(lat, lng, label, note){
    if(lat < -90 || lat > 90 || lng < -180 || lng > 180) return;
    if(lat === 0 && lng === 0) return;
    var key = lat.toFixed(3)+','+lng.toFixed(3);
    if(seen.has(key)) return;
    seen.add(key);
    coords.push({lat:lat, lng:lng, label:label||('Target '+label_idx), note:note||''});
    label_idx++;
  }

  // METHOD 1 — Structured TARGET_COORDS output from GeoMind prompt
  // FORMAT: TARGET_COORDS: [Label] | Lat: -11.2345 | Lon: 27.4567 | UTM_E: 471280 | UTM_N: 8764050
  var tcRe = /TARGET_COORDS:\s*([^|]+)\|[^:]*Lat:\s*(-?\d+\.?\d*)[^:]*Lon:\s*(-?\d+\.?\d*)/gi;
  var m;
  while((m = tcRe.exec(text)) !== null){
    var label = m[1].trim().replace(/^[-—]+/, '').trim();
    addCoord(parseFloat(m[2]), parseFloat(m[3]), label, 'GeoMind target');
  }

  // METHOD 2 — Decimal lat/lon pairs (-11.234, 27.456 or -11.234°S 27.456°E)
  if(coords.length === 0){
    var llRe = /(-?\d{1,3}\.\d{2,8})[°\s]*[NS]?[,;\s]+(-?\d{1,3}\.\d{2,8})[°\s]*[EW]?/g;
    while((m = llRe.exec(text)) !== null){
      var lat = parseFloat(m[1]);
      var lng = parseFloat(m[2]);
      var before = text.substring(Math.max(0,m.index-80), m.index);
      var lm = before.match(/(?:Target|Priority|DH|Drill|Hole|P|Site)\s*[\d\w-]*/i);
      addCoord(lat, lng, lm ? lm[0].trim() : null, '');
      if(coords.length >= 15) break;
    }
  }

  // METHOD 3 — Degrees Minutes Seconds: 11°23'45"S, 27°45'12"E
  if(coords.length === 0){
    var dmsRe = /(\d{1,3})[°\s]+(\d{1,2})['\s]+(\d{1,2}(?:\.\d+)?)["\s]*([NS])[,;\s]+(\d{1,3})[°\s]+(\d{1,2})['\s]+(\d{1,2}(?:\.\d+)?)["\s]*([EW])/gi;
    while((m = dmsRe.exec(text)) !== null){
      var latD = parseInt(m[1]) + parseInt(m[2])/60 + parseFloat(m[3])/3600;
      var lngD = parseInt(m[5]) + parseInt(m[6])/60 + parseFloat(m[7])/3600;
      if(m[4].toUpperCase()==='S') latD = -latD;
      if(m[8].toUpperCase()==='W') lngD = -lngD;
      addCoord(latD, lngD, null, 'DMS format');
      if(coords.length >= 15) break;
    }
  }

  // METHOD 4 — Degrees Decimal Minutes: S 11° 23.456', E 27° 45.123'
  if(coords.length === 0){
    var ddmRe = /([NS])\s*(\d{1,3})[°\s]+(\d{1,2}\.\d+)['\s]*[,;\s]+([EW])\s*(\d{1,3})[°\s]+(\d{1,2}\.\d+)[']/gi;
    while((m = ddmRe.exec(text)) !== null){
      var latD2 = parseInt(m[2]) + parseFloat(m[3])/60;
      var lngD2 = parseInt(m[5]) + parseFloat(m[6])/60;
      if(m[1].toUpperCase()==='S') latD2 = -latD2;
      if(m[4].toUpperCase()==='W') lngD2 = -lngD2;
      addCoord(latD2, lngD2, null, 'DDM format');
      if(coords.length >= 15) break;
    }
  }

  // METHOD 5 — E: 471280, N: 8764050 or Easting: 471280 Northing: 8764050
  if(coords.length === 0){
    var enRe = /(?:E(?:asting)?)[:\s]+(\d{6,7})[,;\s]+(?:N(?:orthing)?)[:\s]+(\d{7,8})/gi;
    while((m = enRe.exec(text)) !== null){
      var e = parseInt(m[1]), n = parseInt(m[2]);
      if(e >= 400000 && e <= 800000 && n >= 8000000 && n <= 9500000){
        var lat3 = (n-10000000)/111320;
        var lng3 = (e-500000)/(111320*Math.cos(lat3*Math.PI/180))+27;
        var before3 = text.substring(Math.max(0,m.index-80),m.index);
        var lm3 = before3.match(/(?:Target|DH|Hole|P)\s*[\d\w]*/i);
        addCoord(lat3, lng3, lm3?lm3[0].trim():null, 'UTM 35S E/N labeled');
        if(coords.length >= 15) break;
      }
    }
  }

  // METHOD 6 — Raw UTM pairs: 471280, 8764050 (Copperbelt range)
  if(coords.length === 0){
    var utmRe = /(\d{6,7})[,\s]+(\d{7,8})/g;
    while((m = utmRe.exec(text)) !== null){
      var e2 = parseInt(m[1]), n2 = parseInt(m[2]);
      if(e2 >= 400000 && e2 <= 800000 && n2 >= 8000000 && n2 <= 9500000){
        var lat4 = (n2-10000000)/111320;
        var lng4 = (e2-500000)/(111320*Math.cos(lat4*Math.PI/180))+27;
        var before4 = text.substring(Math.max(0,m.index-80),m.index);
        var lm4 = before4.match(/(?:Target|DH|Hole|P)\s*[\d\w]*/i);
        addCoord(lat4, lng4, lm4?lm4[0].trim():null, 'UTM 35S approx.');
        if(coords.length >= 15) break;
      }
    }
  }

  return coords;
}

function addInlineMap(div, allText){
  var coords = parseCoordinates(allText || '');
  if(!coords || coords.length === 0) return; // no coords = no map

  // Create inline map container inside the response
  var mapWrap = document.createElement('div');
  mapWrap.style.cssText = 'margin-top:10px;border:1px solid rgba(16,185,129,0.3);border-radius:12px;overflow:hidden;';

  var mapHeader = document.createElement('div');
  mapHeader.style.cssText = 'padding:8px 12px;background:rgba(16,185,129,0.1);display:flex;align-items:center;justify-content:space-between;';
  mapHeader.innerHTML = '<span style="font-size:11px;font-weight:700;color:#10b981;">&#127758; ' + coords.length + ' Target' + (coords.length>1?'s':'') + ' — Satellite Map</span>'
    + '<button onclick="toggleMapSize(this)" style="background:none;border:1px solid rgba(16,185,129,0.3);border-radius:5px;color:#10b981;font-size:10px;padding:2px 8px;cursor:pointer;">Expand</button>';

  var mapDiv = document.createElement('div');
  var mapId = 'inline-map-' + Date.now();
  mapDiv.id = mapId;
  mapDiv.style.cssText = 'height:280px;width:100%;';

  var coordList = document.createElement('div');
  coordList.style.cssText = 'padding:6px 12px;font-size:10px;color:rgba(255,255,255,0.5);background:rgba(0,0,0,0.2);border-top:1px solid rgba(255,255,255,0.06);';
  coordList.innerHTML = coords.map(function(c,i){
    return '<span style="margin-right:12px;"><b style="color:#10b981;">'+(i+1)+'.</b> '+c.label+' ('+c.lat.toFixed(4)+', '+c.lng.toFixed(4)+')'+(c.note?' <i>'+c.note+'</i>':'')+'</span>';
  }).join('');

  mapWrap.appendChild(mapHeader);
  mapWrap.appendChild(mapDiv);
  mapWrap.appendChild(coordList);
  div.appendChild(mapWrap);

  // Init Leaflet map after DOM insertion
  setTimeout(function(){
    if(typeof L === 'undefined') return;
    var map = L.map(mapId, {zoomControl:true, attributionControl:false});
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom:19
    }).addTo(map);
    var bounds = [];
    coords.forEach(function(c, i){
      var icon = L.divIcon({
        html: '<div style="background:linear-gradient(135deg,#10b981,#06b6d4);border:2px solid #fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.5);">'+(i+1)+'</div>',
        className:'', iconSize:[22,22], iconAnchor:[11,11]
      });
      L.marker([c.lat,c.lng],{icon:icon})
        .bindPopup('<b>'+c.label+'</b><br>'+c.lat.toFixed(5)+', '+c.lng.toFixed(5)+(c.note?'<br><i>'+c.note+'</i>':''))
        .addTo(map);
      bounds.push([c.lat,c.lng]);
    });
    if(bounds.length === 1) map.setView(bounds[0], 13);
    else map.fitBounds(bounds, {padding:[20,20]});
    // Store map ref for expand
    mapDiv._leaflet = map;
  }, 200);
}

function toggleMapSize(btn){
  var mapDiv = btn.closest('div').nextElementSibling;
  if(!mapDiv) return;
  var isExpanded = mapDiv.style.height === '520px';
  mapDiv.style.height = isExpanded ? '280px' : '520px';
  btn.textContent = isExpanded ? 'Expand' : 'Collapse';
  // Invalidate map size
  setTimeout(function(){
    if(mapDiv._leaflet) mapDiv._leaflet.invalidateSize();
  }, 100);
}

</script>
